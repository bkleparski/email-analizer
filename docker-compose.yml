services:
  email-analyzer-app:
    build: .
    container_name: email-analyzer-ai
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "5050:80"
    volumes:
      - ./keys:/app/keys
